<html>
  <head>
    <title>hub</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/menu.css" />
  </head>
  <body>
    <div id="wrapper">
      <div id="top_menu">
        <button id="open_setting">⚙</button>
      </div>
      <div id="center_menu">
        <div id="left_contents">
          <div id="game_select_container">
            <button class="game_select" data-game="game1">game1</button>
            <button class="game_select" data-game="gaem2">game2</button>
          </div>
          <div id="user_name_container">
            <input id="user_name" />
          </div>
        </div>
        <div id="rule_container"></div>
      </div>
      <div id="bottom_menu">
        <button id="ready" data-i18n="ui.ready"></button>
      </div>

      <div id="overlay" class="hidden">
        <div class="modal hidden" id="setting_modal">
          <div id="setting"></div>
          <div id="rule_container">
            <h1 data-i18n="rule."></h1>
          </div>
        </div>
      </div>
    </div>

    <script src="././js/hub.js"></script>
  </body>
</html>
