<html>
  <head>
    <title>hub</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/hub.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="top-menu">
        <div class="left-group">
          <div id="user_name_container">
            <input class="input-s" id="user_name" type="text" maxlength="10" />
          </div>
        </div>
        <div class="center-group"></div>
        <div class="right-group">
          <button class="button-letter" id="open_setting">⚙</button>
        </div>
      </div>

      <div class="center-menu">
        <div id="contents_container">
          <div id="contents_1" class="content">
            <div id="game_select_container">
              <div class="game-select" data-game="game1">
                <p data-i18n="ui.game1"></p>
              </div>
              <button class="game-select" data-game="gaem2">game2</button>
            </div>
          </div>
          <div id="contents_2" class="content">
            <div id="rule_container" class="rule-container"></div>
          </div>
        </div>
      </div>

      <div class="bottom-menu">
        <button class="button-l" id="ready" data-i18n="ui.submit"></button>
      </div>

      <div id="overlay" class="overlay hidden">
        <div class="modal hidden" id="message_modal">
          <p id="message"></p>
          <button
            class="button-m able hidden"
            id="message_button"
            data-i18n="ui.close"
          ></button>
        </div>

        <div class="modal" id="setting_modal">
          <div class="setting-container" id="setting_container"></div>
        </div>
      </div>
    </div>

    <script type="module" src="././js/hub.js"></script>
  </body>
</html>
