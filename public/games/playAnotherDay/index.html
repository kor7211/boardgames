<html>
  <head>
    <meta charset="utf-8" />
    <title>playAnotherDay</title>
    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="theme-night">
    <div class="wrapper" id="wrapper">
      <div id="top_menu" class="top-menu">
        <div class="left-group">
          <button class="button-letter caution able" id="open_exit">⍇</button>
        </div>
        <div class="center-group">
          <button class="button-l" id="submit" data-i18n="ui.submit"></button>
        </div>
        <div class="right-group">
          <button class="button-letter able" id="open_setting">⚙</button>
          <button class="button-letter able" id="open_score">⊟</button>
        </div>
      </div>
      <div class="center-menu" id="game_area">
        <div id="table">
          <div class="player_field p1"></div>
          <div class="player_field p2"></div>
          <div class="player_field p3"></div>
          <div class="player_field p4"></div>
          <div class="player_field p5"></div>

          <div class="center_field"></div>
        </div>
        <div id="bottom_blank"></div>
      </div>

      <div id="hands_user"></div>

      <div class="overlay hidden" id="overlay" class="hidden">
        <div class="modal hidden" id="score_modal">
          <div id="score_board"></div>
        </div>

        <div class="modal hidden" id="message_modal">
          <p id="message"></p>
          <button
            class="button-m able hidden"
            id="message_button"
            data-i18n="ui.back"
          ></button>
        </div>

        <div class="modal hidden" id="targeter_modal">
          <div id="targeter"></div>
          <button
            id="submit_targeter"
            class="button-l"
            data-i18n="ui.submit"
          ></button>
        </div>

        <div class="modal hidden" id="exit_modal">
          <span id="exit_notes" data-i18n="ui.exit_notes"></span>
          <div id="button_group">
            <button
              class="button-m caution able"
              id="exit"
              data-i18n="ui.exit"
            ></button>
            <button
              class="button-m able"
              id="close_exit"
              data-i18n="ui.back"
            ></button>
          </div>
        </div>

        <div class="modal hidden" id="setting_modal">
          <div class="setting-container" id="setting_container"></div>
          <div id="rule_cover">
            <div id="rule_container" class="rule-container"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./playAnotherDay.js"></script>
  </body>
</html>
