<html>
  <head>
    <meta charset="utf-8" />
    <title>room</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/room.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="top_menu">
        <button id="open_exit" class="button-letter">⍇</button>
        <div id="room_code_container"></div>
        <div class="right-group">
          <button id="open_setting" class="button-letter">⚙</button>
        </div>
      </div>

      <div class="center_menu">
        <div class="room_modal" id="room_manager_modal">
          <button id="create_room" data-i18n="ui.create"></button>
          <button id="open_join" data-i18n="ui.join"></button>
        </div>
        <div class="room_modal hidden" id="room_wait_modal">
          <div id="player_list">
            <table>
              <tbody></tbody>
            </table>
          </div>
          <span id="player_num"></span>
        </div>
      </div>

      <div class="bottom_menu">
        <button class="button-l" id="ready" data-i18n="ui.ready"></button>
      </div>

      <div class="overlay" id="overlay" class="hidden">
        <div class="modal hidden" id="join_modal">
          <input type="text" inputmode="numeric" id="room_code" />
          <button id="join_room" data-i18n="ui.join"></button>
        </div>
        <div class="modal hidden" id="exit_modal">
          <span id="exit_notes" data-i18n="ui.exit_notes"></span>
          <div id="button_group">
            <button id="exit_room" data-i18n="ui.exit"></button>
            <button id="close_exit" data-i18n="ui.back"></button>
          </div>
        </div>
        <div class="modal hidden" id="setting_modal">
          <div id="setting"></div>
          <div id="rule">
            <div class="rule-container" id="rule_container"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- Socket.IO クライアント -->
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./js/room.js"></script>
  </body>
</html>
