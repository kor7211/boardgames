<html>
  <head>
    <meta charset="utf-8" />
    <title>room</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/room.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="top-menu">
        <div class="left-group">
          <button id="open_exit" class="button-letter caution">⍇</button>
        </div>
        <div class="center-group">
          <div id="room_code_container"></div>
        </div>
        <div class="right-group">
          <button id="open_setting" class="button-letter">⚙</button>
        </div>
      </div>

      <div class="center-menu">
        <div class="room-modal" id="room_manager_modal">
          <div id="button_container">
            <button
              class="button-l able"
              id="create_room"
              data-i18n="ui.create"
            ></button>
            <button
              class="button-l able"
              id="open_join"
              data-i18n="ui.join"
            ></button>
          </div>
        </div>
        <div class="room-modal hidden" id="room_wait_modal">
          <div id="player_list"></div>
        </div>
      </div>

      <div class="bottom-menu">
        <button
          class="button-l hidden"
          id="ready"
          data-i18n="ui.ready"
        ></button>
      </div>

      <div class="overlay hidden" id="overlay">
        <div class="modal hidden" id="join_modal">
          <p data-i18n="ui.room_code"></p>
          <div id="room_code_input_container">
            <input
              class="input-s"
              type="text"
              inputmode="numeric"
              id="room_code"
            />
            <button
              class="button-m able"
              id="join_room"
              data-i18n="ui.join"
            ></button>
          </div>
        </div>

        <div class="modal hidden" id="message_modal">
          <p id="message"></p>
          <button
            class="button-m able hidden"
            id="message_button"
            data-i18n="ui.back"
          ></button>
        </div>

        <div class="modal hidden" id="exit_modal">
          <span id="exit_notes" data-i18n="ui.exit_notes"></span>
          <div id="button_group">
            <button
              class="button-m able caution"
              id="exit_room"
              data-i18n="ui.exit"
            ></button>
            <button
              class="button-m able"
              id="close_exit"
              data-i18n="ui.back"
            ></button>
          </div>
        </div>
        <div class="modal" id="setting_modal">
          <div class="setting-container" id="setting_container"></div>
          <div id="rule_cover">
            <div id="rule_container" class="rule-container"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- Socket.IO クライアント -->
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./js/room.js"></script>
  </body>
</html>
