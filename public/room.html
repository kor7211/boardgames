<html>
  <head>
    <meta charset="utf-8" />
    <title>room</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/room.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="top-menu">
        <button id="open_exit" class="button-letter">⍇</button>
        <div id="room_code_container"></div>
        <div class="right-group">
          <button id="open_setting" class="button-letter">⚙</button>
        </div>
      </div>

      <div class="center-menu">
        <div class="room-modal" id="room_manager_modal">
          <button id="create_room" data-i18n="ui.create"></button>
          <button id="open_join" data-i18n="ui.join"></button>
        </div>
        <div class="room-modal hidden" id="room_wait_modal">
          <div id="player_list"></div>
          <span id="player_num"></span>
        </div>
      </div>

      <div class="bottom-menu">
        <button
          class="button-l hidden"
          id="ready"
          data-i18n="ui.ready"
        ></button>
      </div>

      <div class="overlay hidden" id="overlay">
        <div class="modal hidden" id="join_modal">
          <input type="text" inputmode="numeric" id="room_code" />
          <button id="join_room" data-i18n="ui.join"></button>
        </div>
        <div class="modal hidden" id="message_modal">
          <p id="message"></p>
          <button class="hidden" id="message_button" data-i18n="back"></button>
        </div>
        <div class="modal hidden" id="exit_modal">
          <span id="exit_notes" data-i18n="ui.exit_notes"></span>
          <div id="button_group">
            <button id="exit_room" data-i18n="ui.exit"></button>
            <button id="close_exit" data-i18n="ui.back"></button>
          </div>
        </div>
        <div class="modal" id="setting_modal">
          <div class="setting-container" id="setting_container"></div>
          <div id="rule_cover">
            <div id="rule_container" class="rule-container"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- Socket.IO クライアント -->
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./js/room.js"></script>
  </body>
</html>
